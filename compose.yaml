services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - securedocs_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/securedocs
      UPLOAD_DIR: /app/uploads
      SECUREDOCS_USER: ${SECUREDOCS_USER:-admin}
      SECUREDOCS_PASSWORD: ${SECUREDOCS_PASSWORD:-local-dev-only-change-this}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - securedocs_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - securedocs_net

networks:
  securedocs_net:
    driver: bridge

volumes:
  mongo_data:
  document_uploads:
